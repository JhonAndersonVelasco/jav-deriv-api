[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jav-deriv-api"
version = "0.2.1"
description = "Async Python client library for the Deriv WebSocket and REST APIs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["deriv", "trading", "websocket", "api", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Framework :: AsyncIO",
]

dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "aioresponses>=0.7",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.urls]
Homepage = "https://deriv.com"
"API Docs" = "https://api.deriv.com"
Repository = "https://github.com/JhonAndersonVelasco/deriv-api-python"

[project.scripts]
deriv-setup = "deriv_api.setup_cli:main"

[tool.setuptools]
py-modules = ["jav_deriv_api"]

[tool.setuptools.packages.find]
where = ["."]
include = ["deriv_api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"deriv_api/__init__.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
